<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/Configuracion.js" defer></script>
    <script src="js/ClienteHttp.js" defer></script>
    <script src="js/componentes/Dom.js" defer></script>
    <script src="js/componentes/Menu.js" defer></script>
    <script src="js/componentes/Mensaje.js" defer></script>
    <script src="js/api/SprintsApi.js" defer></script>
    <script src="js/paginas/PaginaFormularioSprint.js" defer></script>
</head>

<body>
    <nav id="menu"></nav>

    <main>
        <h1>Registrar sprint</h1>
        <div id="mensaje"></div>

        <form id="formulario">
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" maxlength="100" required>
            </div>
            <div>
                <label for="fecha_inicio">Fecha de inicio</label>
                <input type="date" name="fecha_inicio" id="fecha_inicio" required>
            </div>
            <div>
                <label for="fecha_fin">Fecha de fin</label>
                <input type="date" name="fecha_fin" id="fecha_fin" required>
            </div>
            <div>
                <button type="submit">Guardar</button>
            </div>
        </form>
    </main>
</body>

</html>
