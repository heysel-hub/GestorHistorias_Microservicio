<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia de usuario</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/Configuracion.js" defer></script>
    <script src="js/ClienteHttp.js" defer></script>
    <script src="js/componentes/Dom.js" defer></script>
    <script src="js/componentes/Menu.js" defer></script>
    <script src="js/componentes/Mensaje.js" defer></script>
    <script src="js/api/SprintsApi.js" defer></script>
    <script src="js/api/HistoriasApi.js" defer></script>
    <script src="js/paginas/PaginaFormularioHistoria.js" defer></script>
</head>

<body>
    <nav id="menu"></nav>

    <main>
        <h1 id="titulo-pagina">Registrar historia de usuario</h1>
        <div id="mensaje"></div>

        <p id="aviso-sin-sprints" class="vacio centrado oculto">
            Primero debes <a href="formulario_sprint.html">crear un sprint</a>.
        </p>

        <form id="formulario" class="oculto">
            <div>
                <label for="titulo">Título</label>
                <input type="text" name="titulo" id="titulo" maxlength="150" required>
            </div>
            <div>
                <label for="descripcion">Descripción</label>
                <textarea name="descripcion" id="descripcion" rows="4" required></textarea>
            </div>
            <div>
                <label for="responsable">Responsable</label>
                <input type="text" name="responsable" id="responsable" maxlength="100" required>
            </div>
            <div>
                <label for="puntos">Puntos de complejidad</label>
                <input type="number" name="puntos" id="puntos" min="1" required>
            </div>
            <div>
                <label for="estado">Estado</label>
                <select name="estado" id="estado" required></select>
            </div>
            <div>
                <label for="sprint_id">Sprint</label>
                <select name="sprint_id" id="sprint_id" required></select>
            </div>
            <div>
                <button type="submit">Guardar</button>
            </div>
        </form>
    </main>
</body>

</html>
